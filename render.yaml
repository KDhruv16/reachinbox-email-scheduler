services:
  # Backend API & BullMQ Background Queue Worker
  - type: web
    name: reachinbox-email-scheduler-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://reachinbox-email-scheduler-frontend.onrender.com
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        value: fvt7mij4nkqfxyzv@ethereal.email
      - key: ETHEREAL_PASS
        value: wVnqa5MYu7gAqudpDV
      - key: MIN_EMAIL_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: WORKER_CONCURRENCY
        value: 5
      - key: DEV_AUTH_BYPASS
        value: false

  # Frontend Static Web Application
  - type: web
    name: reachinbox-email-scheduler-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reachinbox-email-scheduler-api.onrender.com

databases:
  # Free Production PostgreSQL Database
  - name: reachinbox-postgres-db
    plan: free
    region: oregon
    databaseName: reachinbox
    user: reachinbox
